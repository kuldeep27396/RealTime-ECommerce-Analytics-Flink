name: Validate Configuration

on:
  push:
    paths: ['**/*.py', '**/pyproject.toml', '**/config.py']
  pull_request:
    paths: ['**/*.py', '**/pyproject.toml', '**/config.py']

jobs:
  validate-config:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [producer, consumer]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install UV
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Validate configuration schema
      run: |
        uv run python -c "
        import sys
        import os
        sys.path.insert(0, 'services/${{ matrix.service }}/src')
        from config import get_config

        # Set minimal required environment for validation
        os.environ['KAFKA_BOOTSTRAP_SERVERS'] = 'localhost:9092'
        os.environ['KAFKA_API_KEY'] = 'test-key'
        os.environ['KAFKA_API_SECRET'] = 'test-secret'

        print('✓ Configuration schema is valid')
        config = get_config()
        print(f'✓ Configuration loaded successfully')
        "

  validate-secrets:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check required secrets
      run: |
        required_secrets=(
          'KAFKA_BOOTSTRAP_SERVERS'
          'KAFKA_TOPIC'
          'KAFKA_API_KEY'
          'KAFKA_API_SECRET'
          'CLICKHOUSE_HOST'
          'CLICKHOUSE_DATABASE'
          'RAILWAY_TOKEN'
          'RAILWAY_PROJECT_ID'
          'RAILWAY_PRODUCER_SERVICE_ID'
          'RAILWAY_CONSUMER_SERVICE_ID'
        )

        missing_secrets=()
        for secret in \"${required_secrets[@]}\"; do
          if [[ -z \"\${!secret}\" ]]; then
            missing_secrets+=(\"\$secret\")
          fi
        done

        if [ \${#missing_secrets[@]} -gt 0 ]; then
          echo \"❌ Missing required secrets:\"
          printf ' %s\n' \"\${missing_secrets[@]}\"
          echo \"\nPlease add these secrets to your repository settings:\"
          echo \"https://github.com/\${GITHUB_REPOSITORY}/settings/secrets/actions\"
          exit 1
        else
          echo \"✅ All required secrets are configured\"
        fi

      env:
        KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
        KAFKA_TOPIC: ${{ secrets.KAFKA_TOPIC }}
        KAFKA_API_KEY: ${{ secrets.KAFKA_API_KEY }}
        KAFKA_API_SECRET: ${{ secrets.KAFKA_API_SECRET }}
        CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
        CLICKHOUSE_DATABASE: ${{ secrets.CLICKHOUSE_DATABASE }}
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        RAILWAY_PRODUCER_SERVICE_ID: ${{ secrets.RAILWAY_PRODUCER_SERVICE_ID }}
        RAILWAY_CONSUMER_SERVICE_ID: ${{ secrets.RAILWAY_CONSUMER_SERVICE_ID }}