name: Sync Secrets to Railway

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  sync-secrets:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Railway CLI
      run: |
        curl -fsSL https://railway.app/install.sh | sh
        echo ~/.local/bin >> $GITHUB_PATH

    - name: Login to Railway
      run: railway login --token ${{ secrets.RAILWAY_TOKEN }}

    - name: Sync Producer Secrets
      run: |
        railway service variables set \
          PRODUCER_KAFKA_BOOTSTRAP_SERVERS="${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}" \
          PRODUCER_KAFKA_TOPIC="${{ secrets.KAFKA_TOPIC }}" \
          PRODUCER_KAFKA_API_KEY="${{ secrets.KAFKA_API_KEY }}" \
          PRODUCER_KAFKA_API_SECRET="${{ secrets.KAFKA_API_SECRET }}" \
          PRODUCER_API_URL="${{ secrets.API_URL }}" \
          --service-id ${{ secrets.RAILWAY_PRODUCER_SERVICE_ID }}

    - name: Sync Consumer Secrets
      run: |
        railway service variables set \
          CONSUMER_KAFKA_BOOTSTRAP_SERVERS="${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}" \
          CONSUMER_KAFKA_TOPIC="${{ secrets.KAFKA_TOPIC }}" \
          CONSUMER_KAFKA_GROUP_ID="${{ secrets.KAFKA_GROUP_ID }}" \
          CONSUMER_KAFKA_API_KEY="${{ secrets.KAFKA_API_KEY }}" \
          CONSUMER_KAFKA_API_SECRET="${{ secrets.KAFKA_API_SECRET }}" \
          CONSUMER_CLICKHOUSE_HOST="${{ secrets.CLICKHOUSE_HOST }}" \
          CONSUMER_CLICKHOUSE_PORT="${{ secrets.CLICKHOUSE_PORT }}" \
          CONSUMER_CLICKHOUSE_DATABASE="${{ secrets.CLICKHOUSE_DATABASE }}" \
          CONSUMER_CLICKHOUSE_USER="${{ secrets.CLICKHOUSE_USER }}" \
          CONSUMER_CLICKHOUSE_PASSWORD="${{ secrets.CLICKHOUSE_PASSWORD }}" \
          --service-id ${{ secrets.RAILWAY_CONSUMER_SERVICE_ID }}