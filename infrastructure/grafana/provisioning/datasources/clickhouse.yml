apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    orgId: 1
    url: http://clickhouse:8123
    database: ecommerce
    user: ${CLICKHOUSE_USER:-default}
    password: ${CLICKHOUSE_PASSWORD}
    isDefault: true
    version: 1
    editable: false
    jsonData:
      defaultDatabase: ecommerce
      port: 8123
      server: clickhouse
      username: ${CLICKHOUSE_USER:-default}
      tlsAuth: false
      tlsSkipVerify: false
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}