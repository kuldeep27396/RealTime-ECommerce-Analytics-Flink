version: '3.8'

services:
  # Producer Service
  producer:
    build:
      context: .
      dockerfile: infrastructure/railway/producer/Dockerfile
      target: producer
    container_name: ecommerce-producer
    environment:
      - PRODUCER_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - PRODUCER_KAFKA_TOPIC=${KAFKA_TOPIC}
      - PRODUCER_KAFKA_API_KEY=${KAFKA_API_KEY}
      - PRODUCER_KAFKA_API_SECRET=${KAFKA_API_SECRET}
      - PRODUCER_API_URL=${API_URL}
      - PRODUCER_API_RATE=${API_RATE:-100}
      - PRODUCER_API_DURATION=${API_DURATION:-30}
      - PRODUCER_LOG_LEVEL=${PRODUCER_LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      - kafka

  # Consumer Service
  consumer:
    build:
      context: .
      dockerfile: infrastructure/railway/consumer/Dockerfile
      target: consumer
    container_name: ecommerce-consumer
    environment:
      - CONSUMER_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - CONSUMER_KAFKA_TOPIC=${KAFKA_TOPIC}
      - CONSUMER_KAFKA_GROUP_ID=${KAFKA_GROUP_ID}
      - CONSUMER_KAFKA_API_KEY=${KAFKA_API_KEY}
      - CONSUMER_KAFKA_API_SECRET=${KAFKA_API_SECRET}
      - CONSUMER_CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CONSUMER_CLICKHOUSE_PORT=${CLICKHOUSE_PORT}
      - CONSUMER_CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE}
      - CONSUMER_CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CONSUMER_CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CONSUMER_FLINK_PARALLELISM=${CONSUMER_FLINK_PARALLELISM:-2}
      - CONSUMER_LOG_LEVEL=${CONSUMER_LOG_LEVEL:-INFO}
    ports:
      - "8081:8081"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - kafka
      - clickhouse

  # Kafka (for local development)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - ecommerce-network
    depends_on:
      - zookeeper

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce-network

  # ClickHouse (for local development)
  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    container_name: ecommerce-clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./infrastructure/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-ecommerce}
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis (for caching and session management)
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    command: redis-server --appendonly yes

  # Grafana (for monitoring and dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - ecommerce-network
    depends_on:
      - clickhouse

networks:
  ecommerce-network:
    driver: bridge

volumes:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  grafana_data: