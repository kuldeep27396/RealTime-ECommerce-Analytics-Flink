[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[project]
name = "realtime-ecommerce-analytics"
version = "0.1.0"
description = "Real-time e-commerce analytics pipeline with Apache Flink and ClickHouse"
authors = [
    {name = "Kuldeep", email = "kuldeep@example.com"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "kafka-python==2.2.15",
    "requests==2.32.5",
    "python-dotenv==1.0.1",
    "confluent-kafka==2.11.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.8.1",
    "structlog==24.4.0",
    "clickhouse-connect==0.6.21",
    "pandas==2.2.3",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "uv>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

# Service-specific dependencies
producer = [
    "kafka-python==2.2.15",
    "requests==2.32.5",
    "python-dotenv==1.0.1",
    "confluent-kafka==2.11.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.8.1",
    "structlog==24.4.0",
]

consumer = [
    "apache-flink==1.18.0",
    "confluent-kafka==2.11.1",
    "clickhouse-connect==0.6.21",
    "pandas==2.2.3",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.8.1",
]

[project.urls]
Homepage = "https://github.com/yourusername/RealTime-ECommerce-Analytics-Flink"
Repository = "https://github.com/yourusername/RealTime-ECommerce-Analytics-Flink.git"
Documentation = "https://github.com/yourusername/RealTime-ECommerce-Analytics-Flink/blob/main/docs/"
"Bug Tracker" = "https://github.com/yourusername/RealTime-ECommerce-Analytics-Flink/issues"

[project.scripts]
producer = "services.producer.src.main:main"
consumer = "services.consumer.src.main:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["services"]

[tool.flake8]
max-line-length = 88
ignore = ["E203", "W503", "E501", "F401", "F841", "E402", "F541", "F821"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "*.egg-info",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
namespace_packages = true
explicit_package_bases = ["services"]

[[tool.mypy.overrides]]
module = [
    "kafka.*",
    "confluent_kafka.*",
    "clickhouse_connect.*",
    "pandas.*",
    "structlog.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=services",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["services"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]