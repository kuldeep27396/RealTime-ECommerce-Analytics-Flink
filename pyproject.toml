[project]
name = "realtime-ecommerce-analytics"
version = "0.1.0"
description = "Simple real-time e-commerce analytics with Confluent Cloud and Flink"
requires-python = ">=3.11"
dependencies = [
    "kafka-python==2.2.15",
    "requests==2.32.5",
    "python-dotenv==1.0.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.8.1",
    "apache-flink==1.18.0",
]

[project.scripts]
producer = "services.producer.src.main:main"
consumer = "services.consumer.src.main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88